<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>عداد زيارة عاشوراء</title>
    <style>
      body {
        text-align: center;
        font-family: Arial, sans-serif;
        margin-top: 50px;
      }
      h1 {
        font-size: 50px;
        color: #333;
      }
      .button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        margin: 10px;
        border: none;
        border-radius: 5px;
      }
      .add-btn {
        background-color: #4caf50;
        color: white;
        transition: opacity 0.15s;
      }
      .add-btn:hover {
        opacity: 0.8;
      }
      .add-btn:active {
        opacity: 0.6;
      }
      .reset-btn {
        background-color: #f44336;
        color: white;
        transition: opacity 0.15s;
      }
      .reset-btn:hover {
        opacity: 0.8;
      }
      .reset-btn:active {
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <h2>عدد أيام قراءة زيارة عاشوراء:</h2>
    <h1 id="counterDisplay">0</h1>

    <button class="button add-btn" onclick="addDay()">سجل قراءة اليوم</button>
    <button class="button reset-btn" onclick="resetCounter()">تصفير العداد</button>

    <script>
      let count = localStorage.getItem("ashuraCount") || 0;
      document.getElementById("counterDisplay").innerText = count;

      function addDay() {
        count++;
        document.getElementById("counterDisplay").innerText = count;
        localStorage.setItem("ashuraCount", count);
      }

      function resetCounter() {
        let confirmReset = confirm("هل أنت متأكد أنك تبي تصفر العداد وتبدأ من جديد؟");
        if (confirmReset) {
          count = 0;
          document.getElementById("counterDisplay").innerText = count;
          localStorage.removeItem("ashuraCount");
        }
      }
    </script>
  </body>
</html>
