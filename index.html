<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>عداد زيارة عاشوراء</title>
    
    <style>
      body {
        text-align: center;
        font-family: Arial, sans-serif;
        margin-top: 60px;
        padding: 0 15px; 
        transition: background-color 0.3s, color 0.3s;
      }

      .main, .c1, .c3, .c5 {
        font-size: 22px; 
        color: #333;
        margin-bottom: 30px;
        line-height: 2; 
      }

      .secondry, .c2, .c4, .c6 {
        font-size: 20px;
        color: red;
        margin-bottom: 20px;
        font-weight: bold;
      }

      .c6 {
        margin-top: 40px;
      }

      .t1 {
        font-size: 30px;
        color: #555;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 50px;
        color: #333;
        margin: 20px 0;
      }

      .button {
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
        margin: 10px;
        border: none;
        border-radius: 5px;
      }

      .add-btn { background-color: #4caf50; color: white; transition: opacity 0.15s; }
      .add-btn:hover { opacity: 0.8; }
      .add-btn:active { opacity: 0.6; }

      .reset-btn { background-color: #f44336; color: white; transition: opacity 0.15s; }
      .reset-btn:hover { opacity: 0.8; }
      .reset-btn:active { opacity: 0.6; }

      .login-btn { background-color: #4285F4; color: white; transition: opacity 0.15s; }
      .login-btn:hover { opacity: 0.8; }
      .logout-btn { background-color: #555; color: white; }

      /* زر الوضع الليلي */
      .Dark-mode-btn {
        height: 50px;
        width: 50px;
        padding: 0;
        border-radius: 40px;
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        top: 20px;
        left: 20px;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .Dark-mode-btn:hover { opacity: 0.8; }
      .Dark-mode-btn:active{ opacity: 0.6; }

      #darkModeToggle svg:first-child { display: none; }
      #darkModeToggle svg:last-child { display: block; }
      body.dark-theme #darkModeToggle svg:last-child { display: none; }
      body.dark-theme #darkModeToggle svg:first-child { display: block; }

      /* الوضع الليلي للألوان */
      body.dark-theme { background-color: #121212; color: #ffffff; }
      body.dark-theme .main, body.dark-theme .c1, body.dark-theme .c3, 
      body.dark-theme .c5, body.dark-theme .t1, body.dark-theme h1 {
        color: #dddddd; 
      }
    </style>
  </head>
  <body>

    <!-- حاوية زر الوضع الليلي -->
    <div style="text-align: left">
      <button id="darkModeToggle" class="Dark-mode-btn">
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path d="M338.5-338.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3">
          <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
        </svg>
      </button>
    </div>

    <h2 class="t1">زيارة عاشوراء</h2>

    <p class="main">
      اَلسَّلامُ عَلَيْكَ يَا أَبَا عَبْدِ اللهِ ، اَلسَّلامُ عَلَيْكَ يَا بْنَ رَسُولِ اللهِ... 
      (النص كامل كما هو في ملفك الأصلي)
      ... لِنَبِيِّكَ وَآلِ نَبِيِّكَ ـ عَلَيْهِ وَعَلَيْهِمُ السَّلامُ
    </p>

    <hr style="width: 80%; margin: 40px auto; border: 1px solid #ddd" />

    <!-- قسم الحساب وتسجيل الدخول السحابي -->
    <div style="margin-bottom: 30px;">
      <h3 id="userInfo" style="display: none; color: #4caf50;"></h3>
      <button id="loginBtn" class="button login-btn">تسجيل الدخول بجوجل لحفظ تقدمك</button>
      <button id="logoutBtn" class="button logout-btn" style="display: none;">تسجيل الخروج</button>
    </div>

    <h2 class="t1">عدد أيام القراءة:</h2>
    <h1 id="counterDisplay">0</h1>

    <!-- تم تغيير onclick إلى id للربط مع السيرفر -->
    <button id="addBtn" class="button add-btn">سجل قراءة اليوم</button>
    <button id="resetBtn" class="button reset-btn">تصفير العداد</button>

    <!-- استدعاء مكتبات فايربيس -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <script>
      // 1. إعدادات فايربيس الخاصة بمشروعك
      const firebaseConfig = {
        apiKey: "AIzaSyCQLgilHSTuES_fiXKWD8NREbL6ia41peA",
        authDomain: "ashura-counter.firebaseapp.com",
        projectId: "ashura-counter",
        storageBucket: "ashura-counter.firebasestorage.app",
        messagingSenderId: "6941950909",
        appId: "1:6941950909:web:3c2b73f53bb425a89b48d4"
      };

      // 2. تشغيل فايربيس
      firebase.initializeApp(firebaseConfig);
      const auth = firebase.auth();
      const db = firebase.firestore();
      const provider = new firebase.auth.GoogleAuthProvider();

      let count = 0;
      let currentUser = null;

      // عناصر الواجهة
      const counterDisplay = document.getElementById("counterDisplay");
      const loginBtn = document.getElementById("loginBtn");
      const logoutBtn = document.getElementById("logoutBtn");
      const userInfo = document.getElementById("userInfo");
      const addBtn = document.getElementById("addBtn");
      const resetBtn = document.getElementById("resetBtn");

      // 3. مراقبة حالة تسجيل الدخول (متصل أو غير متصل)
      auth.onAuthStateChanged((user) => {
        if (user) {
          // إذا كان المستخدم مسجل دخوله
          currentUser = user;
          loginBtn.style.display = "none";
          logoutBtn.style.display = "inline-block";
          userInfo.style.display = "block";
          userInfo.innerText = "أهلاً بك، " + user.displayName;

          // جلب العداد من السيرفر (قاعدة البيانات)
          db.collection("users").doc(user.uid).get().then((doc) => {
            if (doc.exists) {
              count = doc.data().ashuraCount || 0;
            } else {
              count = 0;
            }
            counterDisplay.innerText = count;
          }).catch((error) => console.log(error));

        } else {
          // إذا كان غير مسجل دخوله
          currentUser = null;
          loginBtn.style.display = "inline-block";
          logoutBtn.style.display = "none";
          userInfo.style.display = "none";

          // الاعتماد على التخزين المحلي كبديل
          count = localStorage.getItem("ashuraCount") || 0;
          counterDisplay.innerText = count;
        }
      });

      // 4. برمجة زر تسجيل الدخول
      loginBtn.addEventListener("click", () => {
        auth.signInWithPopup(provider).catch((error) => {
          alert("حدث خطأ أثناء تسجيل الدخول: " + error.message);
        });
      });

      // 5. برمجة زر تسجيل الخروج
      logoutBtn.addEventListener("click", () => {
        auth.signOut();
      });

      // 6. برمجة زر زيادة العداد (حفظ في السيرفر أو الجهاز)
      addBtn.addEventListener("click", () => {
        count++;
        counterDisplay.innerText = count;

        if (currentUser) {
          // الحفظ في السيرفر
          db.collection("users").doc(currentUser.uid).set({
            ashuraCount: count
          }, { merge: true });
        } else {
          // الحفظ في الجهاز
          localStorage.setItem("ashuraCount", count);
        }
      });

      // 7. برمجة زر تصفير العداد
      resetBtn.addEventListener("click", () => {
        let confirmReset = confirm("هل أنت متأكد أنك تبي تصفر العداد وتبدأ من جديد؟");
        if (confirmReset) {
          count = 0;
          counterDisplay.innerText = count;

          if (currentUser) {
            db.collection("users").doc(currentUser.uid).set({
              ashuraCount: count
            }, { merge: true });
          } else {
            localStorage.removeItem("ashuraCount");
          }
        }
      });

      // 8. كود الوضع الليلي (كما هو)
      const darkModeToggle = document.getElementById("darkModeToggle");
      const body = document.body;

      if (localStorage.getItem("theme") === "dark") {
        body.classList.add("dark-theme");
      }

      darkModeToggle.addEventListener("click", () => {
        body.classList.toggle("dark-theme");
        if (body.classList.contains("dark-theme")) {
          localStorage.setItem("theme", "dark");
        } else {
          localStorage.setItem("theme", "light");
        }
      });
    </script>
  </body>
</html>
