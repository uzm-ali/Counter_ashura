<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - عدّاد الزيارات</title>
<style>
/* نفس الألوان الأساسية للموقع */
:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --tx: #1e293b;
  --mut: #64748b;
  --ac: #2563eb;
  --gold: #d97706;
  --bd: #e2e8f0;
}
body.dark-theme {
  --bg: #0b1120;
  --card: #1e293b;
  --tx: #f8fafc;
  --mut: #94a3b8;
  --bd: #334155;
  --ac: #3b82f6;
  --gold: #fbbf24;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: Tahoma, "Segoe UI", sans-serif; transition: background 0.3s; display: flex; flex-direction: column; min-height: 100vh; align-items: center; justify-content: center; }

.topbar { position: absolute; top: 0; width: 100%; z-index: 10; background: var(--card); border-bottom: 1px solid var(--bd); display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
.topbar h1 { font-size: 18px; margin: 0; color: var(--ac); }

main { max-width: 400px; width: 90%; margin: 60px auto 20px; }

.card { background: var(--card); border: 1px solid var(--bd); border-radius: 14px; padding: 24px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
.card h2 { margin-top: 0; color: var(--gold); }
.mut { color: var(--mut); font-size: 14px; margin-bottom: 16px; }

.input-group { text-align: right; margin-bottom: 14px; }
.input-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
.input-field { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--bd); background: var(--bg); color: var(--tx); font-size: 16px; font-family: inherit; transition: 0.2s; }
.input-field:focus { outline: none; border-color: var(--ac); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }

.btn { width: 100%; background: var(--ac); color: #fff; border: 0; border-radius: 10px; padding: 12px; font-size: 16px; cursor: pointer; margin-top: 10px; font-weight: bold; transition: 0.2s; }
.btn:hover { opacity: 0.9; transform: translateY(-1px); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn.ghost { background: none; color: var(--ac); border: 1px solid var(--ac); }
.btn.ghost:hover { background: var(--ac); color: #fff; }

.toggle-link { color: var(--ac); cursor: pointer; font-size: 14px; display: inline-block; margin-top: 16px; text-decoration: underline; }
.toggle-link:hover { color: var(--gold); }

/* وضع الإخفاء للعناصر */
.hidden { display: none; }
#errorMsg { color: #ef4444; font-size: 13px; margin-top: 10px; text-align: right; min-height: 20px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>عدّاد الزيارات والأدعية</h1>
  <button class="btn ghost" id="darkModeToggle" style="width:auto; padding:6px 12px; margin:0;">🌙</button>
</div>

<main>
  <div class="card">
    <h2 id="formTitle">تسجيل الدخول</h2>
    <div class="mut" id="formSub">مرحباً بك مجدداً، يرجى تسجيل الدخول لمتابعة السجل</div>
    
    <form id="authForm" onsubmit="event.preventDefault();">
      <div class="input-group hidden" id="nameGroup">
        <label>الاسم (اختياري)</label>
        <input type="text" id="nameInput" class="input-field" placeholder="كيف تحب أن نناديك؟">
      </div>
      
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="emailInput" class="input-field" placeholder="example@email.com" required>
      </div>
      
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="passInput" class="input-field" placeholder="••••••••" required minlength="6">
      </div>

      <div id="errorMsg"></div>

      <button type="submit" class="btn" id="submitBtn">دخول</button>
    </form>
    
    <span class="toggle-link" id="toggleMode">ليس لديك حساب؟ أنشئ حساباً جديداً</span>
    
    <hr style="border: 0; border-top: 1px solid var(--bd); margin: 20px 0;">
    <button class="btn ghost" id="guestBtn" style="font-weight:normal;">المتابعة كزائر (بدون حساب)</button>
  </div>
</main>

<!-- Firebase Scripts -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
// إعدادات فايربيس (نفس الموجودة في مشروعك)
const firebaseConfig = {
  apiKey: "AIzaSyCQLgilHSTuES_fiXKWD8NREbL6ia41peA",
  authDomain: "ashura-counter.firebaseapp.com",
  projectId: "ashura-counter",
  storageBucket: "ashura-counter.firebasestorage.app",
  messagingSenderId: "6941950909",
  appId: "1:6941950909:web:3c2b73f53bb425a89b48d4"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// إذا كان المستخدم مسجلاً مسبقاً، وجهه فوراً للرئيسية
auth.onAuthStateChanged(user => {
  if(user) {
    window.location.href = "index.html";
  }
});

// متغيرات الواجهة
let isLogin = true;
const formTitle = document.getElementById("formTitle");
const formSub = document.getElementById("formSub");
const nameGroup = document.getElementById("nameGroup");
const toggleMode = document.getElementById("toggleMode");
const submitBtn = document.getElementById("submitBtn");
const errorMsg = document.getElementById("errorMsg");

// التبديل بين تسجيل الدخول والإنشاء
toggleMode.onclick = () => {
  isLogin = !isLogin;
  errorMsg.innerText = "";
  if(isLogin){
    formTitle.innerText = "تسجيل الدخول";
    formSub.innerText = "مرحباً بك مجدداً، يرجى تسجيل الدخول لمتابعة السجل";
    nameGroup.classList.add("hidden");
    submitBtn.innerText = "دخول";
    toggleMode.innerText = "ليس لديك حساب؟ أنشئ حساباً جديداً";
  } else {
    formTitle.innerText = "إنشاء حساب";
    formSub.innerText = "احفظ سجلاتك وتابع قراءتك من أي جهاز";
    nameGroup.classList.remove("hidden");
    submitBtn.innerText = "تسجيل الحساب";
    toggleMode.innerText = "لديك حساب بالفعل؟ سجل دخولك";
  }
};

// معالجة الفورم (الدخول / التسجيل)
document.getElementById("authForm").onsubmit = () => {
  const email = document.getElementById("emailInput").value.trim();
  const pass = document.getElementById("passInput").value;
  const name = document.getElementById("nameInput").value.trim();

  submitBtn.disabled = true;
  submitBtn.innerText = "جاري التحميل...";
  errorMsg.innerText = "";

  if(isLogin){
    // تسجيل الدخول
    auth.signInWithEmailAndPassword(email, pass)
      .catch(e => showError(e.code));
  } else {
    // إنشاء الحساب
    auth.createUserWithEmailAndPassword(email, pass)
      .then(userCred => {
        if(name) {
          return userCred.user.updateProfile({ displayName: name });
        }
      })
      .catch(e => showError(e.code));
  }
};

// ترجمة أخطاء فايربيس للمستخدم
function showError(code){
  submitBtn.disabled = false;
  submitBtn.innerText = isLogin ? "دخول" : "تسجيل الحساب";
  let msg = "حدث خطأ غير معروف.";
  if(code === "auth/invalid-credential" || code === "auth/user-not-found" || code === "auth/wrong-password") msg = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
  else if(code === "auth/email-already-in-use") msg = "هذا البريد الإلكتروني مسجل مسبقاً.";
  else if(code === "auth/weak-password") msg = "كلمة المرور ضعيفة، يجب أن تكون 6 أحرف على الأقل.";
  else if(code === "auth/network-request-failed") msg = "تأكد من اتصالك بالإنترنت.";
  errorMsg.innerText = msg;
}

// الدخول كزائر (بدون حساب)
document.getElementById("guestBtn").onclick = () => {
  // تفعيل الوضع التجريبي وتوجيه المستخدم للرئيسية
  // فايربيس لن يتم استدعاء auth.signIn به، لذا سيكون الحساب null
  window.location.href = "index.html";
};

// دعم الوضع الليلي في صفحة الدخول
function applyTheme(){
  const t = localStorage.getItem("theme");
  const isDark = t === "dark" || (t !== "light" && new Date().getHours() >= 18 || new Date().getHours() < 6);
  document.body.classList.toggle("dark-theme", isDark);
  document.getElementById("darkModeToggle").innerText = isDark ? "☀️" : "🌙";
}
document.getElementById("darkModeToggle").onclick = () => { 
  const isDark = document.body.classList.contains("dark-theme");
  localStorage.setItem("theme", isDark ? "light" : "dark"); 
  applyTheme(); 
};
applyTheme();
</script>
</body>
</html>
